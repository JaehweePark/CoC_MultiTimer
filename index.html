<script>// 웹(PWA)용 구글 드라이브 appDataFolder 백업/복원 — Google Identity Services(GIS) + Drive REST.

// 데이터 파일명(coctimer-sync.json)·폴더(appDataFolder)는 네이티브 drive.js와 동일 →
// 아이패드(PWA)와 안드로이드(네이티브)가 같은 드라이브 폴더로 동기화된다.
(function () {
  var CLIENT_ID = "303614628771-8drq0a0puvpam09eieqlv2r4fostrfcg.apps.googleusercontent.com";
  var SCOPE = "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email";
  var FILE = "coctimer-sync.json";
  var token = null, email = null, client = null;
  var TOK_KEY = "cctimer_drive_tok";
  // accessToken을 만료시각과 함께 캐시 → 새로고침/백업/복원 시 1시간 내 재사용(로그인 팝업 0)
  function saveTok(resp) {
    token = resp.access_token;
    var ttl = ((resp.expires_in || 3600) - 120) * 1000; // 만료 2분 전까지 유효 취급
    try { localStorage.setItem(TOK_KEY, JSON.stringify({ t: token, e: Date.now() + ttl })); } catch (e) {}
  }
  function loadTok() {
    try {
      var s = JSON.parse(localStorage.getItem(TOK_KEY) || "null");
      if (s && s.t && s.e > Date.now()) { token = s.t; return true; }
    } catch (e) {}
    return false;
  }

  function ensureClient() {
    if (client) return true;
    if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
    client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: function () {} });
    return true;
  }
  // prompt: "consent"(최초 동의) | ""(무인 시도, 불가하면 에러만, 팝업 안 띄움)
  function getToken(prompt) {
    return new Promise(function (resolve, reject) {
      if (!ensureClient()) return reject(new Error("gis-not-loaded"));
      client.callback = function (resp) {
        if (resp && resp.access_token) { saveTok(resp); resolve(token); }
        else reject(new Error((resp && resp.error) || "no-token"));
      };
      client.error_callback = function (err) { reject(new Error((err && err.type) || "gis-error")); };
      try { client.requestAccessToken({ prompt: prompt }); } catch (e) { reject(e); }
    });
  }
  function fetchEmail() {
    return fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.email) email = j.email; })
      .catch(function () {});
  }
  async function signIn() { await getToken("consent"); await fetchEmail(); return { email: email }; }
  async function signOut() {
    try { if (token && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(token, function () {}); } catch (e) {}
    token = null; email = null;
    try { localStorage.removeItem(TOK_KEY); } catch (e) {}
  }
  async function status() { if (!token) loadTok(); return { signedIn: !!token, email: email }; }
  // 앱 열 때(콜드스타트): 캐시된 토큰이 유효할 때만 복원. 없으면 로그인 팝업 안 띄움(매번 로그인 방지).
  async function resume(savedEmail) {
    if (savedEmail) email = savedEmail;
    return loadTok();
  }
  // 자동(백그라운드) 작업용: 캐시 토큰만. 없으면 실패 → 자동 동기화는 조용히 건너뜀(팝업 X).
  async function ensureToken() { if (token) return; if (loadTok()) return; throw new Error("no-token"); }
  // 수동 동기화용: 토큰 없으면 로그인 시도(사용자가 [동기화]를 눌렀을 때만). 조용히 시도 → 안 되면 로그인 UI.
  async function ensureAuth() {
    if (token) return; if (loadTok()) return;
    try { await getToken(""); } catch (e) { await getToken("consent"); }
    if (!email) await fetchEmail();
  }
  async function findId() {
    var q = encodeURIComponent("name='" + FILE + "'");
    var r = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=" + q,
      { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) throw new Error("drive-list-" + r.status);
    var j = await r.json();
    return j.files && j.files[0] ? j.files[0].id : null;
  }
  async function upload(jsonStr) {
    await ensureToken();
    var id = await findId();
    var boundary = "cctb" + Math.random().toString(16).slice(2);
    var meta = id ? {} : { name: FILE, parents: ["appDataFolder"] };
    var body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
      "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + jsonStr + "\r\n--" + boundary + "--";
    var base = "https://www.googleapis.com/upload/drive/v3/files";
    var url = id ? base + "/" + id + "?uploadType=multipart" : base + "?uploadType=multipart";
    var r = await fetch(url, {
      method: id ? "PATCH" : "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "multipart/related; boundary=" + boundary },
      body: body,
    });
    if (!r.ok) throw new Error("drive-upload-" + r.status);
  }
  async function download() {
    await ensureToken();
    var id = await findId();
    if (!id) return null;
    var r = await fetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) throw new Error("drive-download-" + r.status);
    return await r.text();

})();
