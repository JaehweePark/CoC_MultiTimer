<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCTimer DB 편집</title>
<style>
  :root{--bg:#0f1a12;--card:#182619;--line:rgba(255,255,255,.1);--gold:#F5B82E;--txt:#F2EFE4;--sub:#8FA08C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Noto Sans KR","Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:0 0 4px}.muted{color:var(--sub);font-size:12px;line-height:1.5}
  input,select,button{font-family:inherit}
  .gate{max-width:460px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .gate input[type=password]{width:100%;padding:10px;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .btn{background:var(--gold);color:#1f1709;border:none;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--line)}
  .topbar{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tab{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--sub);border-radius:99px;padding:7px 16px;font-weight:800;cursor:pointer}
  .tab.on{background:var(--gold);color:#1f1709;border-color:var(--gold)}
  .row2{display:flex;gap:8px;align-items:center}
  .row2{flex-wrap:wrap}
  .row2 input.search{flex:1;min-width:130px;padding:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .row2 .sortsel{padding:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .cats{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .cat{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--sub);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .cat.on{background:#F2EFE4;color:#14210f;border-color:#F2EFE4}
  .status{font-size:12px;color:var(--sub);margin-top:6px}
  .list{margin-top:6px}
  .item{display:flex;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:active{background:rgba(255,255,255,.05)}
  .item .id{font-family:monospace;font-size:11px;color:var(--sub);width:64px;flex:none}
  .item .nm{flex:1;font-weight:700}.item .nm small{color:var(--sub);font-weight:400;margin-left:6px}
  .item .meta{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
  .item.dirty{background:rgba(245,184,46,.08)}
  .item.bb .nm{color:var(--gold)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:16px}.modal .mid{font-family:monospace;font-size:11px;color:var(--sub);margin-bottom:12px}
  .fld{margin-bottom:10px}.fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
  .fld input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt)}
  .costgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .costgrid .c{display:flex;align-items:center;gap:3px}.costgrid .c b{font-size:10px;color:var(--sub);width:28px;flex:none}
  .costgrid .c input{width:100%;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px}
  .mbtns{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>🔒 CCTimer DB 편집</h1>
    <p class="muted">GitHub Fine-grained 토큰(이 저장소 <b>Contents: Read and write</b>). 토큰은 이 기기에만 저장됩니다.</p>
    <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
    <label class="muted"><input type="checkbox" id="remember" checked> 이 기기에 기억</label>
    <div style="margin-top:12px"><button class="btn" id="enterBtn" onclick="enter()">불러오기</button></div>
    <p id="gerr" class="muted" style="color:#E08B8B"></p>
  </div>

  <div id="app" style="display:none">
    <div class="topbar">
      <div class="tabs">
        <button class="tab on" data-t="names" onclick="switchTab('names')">이름 수정</button>
        <button class="tab" data-t="gd" onclick="switchTab('gd')">게임데이터 수정</button>
      </div>
      <div class="row2">
        <input class="search" id="q" placeholder="검색 (이름·ID)" oninput="renderList()">
        <select id="sort" class="sortsel" onchange="setSort(this.value)">
          <option value="id">ID순</option>
          <option value="name">이름순</option>
          <option value="cat">분류순</option>
          <option value="max">최대레벨순</option>
          <option value="dirty">변경먼저</option>
        </select>
        <button class="btn" id="saveBtn" onclick="saveAll()">저장</button>
        <button class="btn ghost" onclick="logout()">잠금</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div id="modalOv" class="ov" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div class="mid" id="mId"></div>
    <div id="mBody"></div>
    <div class="mbtns">
      <button class="btn" onclick="saveModal()">확인</button>
      <button class="btn ghost" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<script>
const OWNER="JaehweePark", REPO="CoC_MultiTimer", BRANCH="main";
const FILES={ en:"names/en.json", ko:"names/ko.json", gd:"gamedata.json" };
let token="", shas={}, orig={en:{},ko:{},gd:{}}, rows=[], byId={}, curTab="names", curCat="", curSort="id", editId=null;

// 분류: 본마을 건물은 ID 매핑, 나머지는 ID 범위. _BB(한글 끝)는 자동 장인기지.
const TOWERS=new Set("1000008 1000009 1000013 1000012 1000011 1000028 1000019 1000032 1000021 1000027 1000031 1000067 1000077 1000089 1000010 1000084 1000085 1000079 1000086 1000102".split(" ").map(Number));
const RESOURCE=new Set("1000004 1000002 1000005 1000003 1000023 1000024".split(" ").map(Number));
const ARMY=new Set("1000000 1000006 1000026 1000007 1000020 1000029 1000071 1000070 1000059 1000068 1000014".split(" ").map(Number));
const CATS=["방어타워","자원","군대","함정","유닛","마법","영웅","펫","가디언","장인기지","기타건물"];
const BB_IDS=new Set("1000033 1000034 1000035 1000036 1000037 1000038 1000039 1000040 1000041 1000042 1000043 1000044 1000045 1000046 1000048 1000049 1000050 1000051 1000052 1000053 1000054 1000055 1000056 1000057 1000058 1000063 1000065 1000078 1000080 1000081 1000082 12000010 12000011 12000013 12000014 4000031 4000032 4000033 4000034 4000035 4000036 4000037 4000038 4000041 4000042 4000070 28000003 28000005".split(" ").map(Number));
function displayKo(r){ return BB_IDS.has(+r.id) ? String(r.ko).replace(/_BB$/,"") : r.ko; }
function category(r){
  if(BB_IDS.has(+r.id)) return "장인기지";
  const id=+r.id;
  if(id>=107000000) return "가디언";
  if(id>=73000000) return "펫";
  if(id>=28000000) return "영웅";
  if(id>=26000000) return "마법";
  if(id>=12000000) return "함정";
  if(id>=4000000) return "유닛";
  if(TOWERS.has(id)) return "방어타워";
  if(RESOURCE.has(id)) return "자원";
  if(ARMY.has(id)) return "군대";
  if(id>=1000000) return "기타건물";
  return "기타";
}

function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,"")))); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

async function enter(){
  token=document.getElementById("tok").value.trim(); if(!token) return;
  if(document.getElementById("remember").checked) localStorage.setItem("gh_token",token); else localStorage.removeItem("gh_token");
  const b=document.getElementById("enterBtn"); b.disabled=true; document.getElementById("gerr").textContent="불러오는 중…";
  try{
    for(const [k,p] of Object.entries(FILES)){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}?ref=${BRANCH}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"}});
      if(!r.ok) throw new Error(p+" "+r.status);
      const j=await r.json(); shas[k]=j.sha; orig[k]=JSON.parse(b64decode(j.content));
    }
    buildRows(); renderCats();
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    renderList();
  }catch(e){ document.getElementById("gerr").textContent="실패: "+e.message+" — 토큰/권한(Contents write) 확인"; }
  finally{ b.disabled=false; }
}

function buildRows(){
  const ids=new Set([...Object.keys(orig.en),...Object.keys(orig.ko),...Object.keys(orig.gd)]);
  rows=[...ids].sort((a,b)=>(+a)-(+b)).map(id=>{ const g=orig.gd[id]||{}; return { id, en:orig.en[id]||"", ko:orig.ko[id]||"", m:(g.m??""), r:(Array.isArray(g.r)?g.r.join(","):(g.r||"")), c:(g.c?g.c.slice():[]) }; });
  byId={}; rows.forEach(r=>byId[r.id]=r);
}

function renderCats(){
  const c=document.getElementById("cats");
  const mk=(v,lbl)=>`<button class="cat${curCat===v?' on':''}" onclick="setCat('${v}')">${lbl}</button>`;
  c.innerHTML=mk("","전체")+CATS.map(x=>mk(x,x)).join("");
}
function setCat(c){ curCat=c; renderCats(); renderList(); }
function setSort(v){ curSort=v; renderList(); }
function sortedRows(){
  const a=rows.slice();
  if(curSort==="name") a.sort((x,y)=>String(displayKo(x)||x.en).localeCompare(String(displayKo(y)||y.en),"ko"));
  else if(curSort==="cat") a.sort((x,y)=>category(x).localeCompare(category(y),"ko")||(+x.id)-(+y.id));
  else if(curSort==="max") a.sort((x,y)=>(Number(y.m)||0)-(Number(x.m)||0)||(+x.id)-(+y.id));
  else if(curSort==="dirty") a.sort((x,y)=>(dirtyOf(y)?1:0)-(dirtyOf(x)?1:0)||(+x.id)-(+y.id));
  else a.sort((x,y)=>(+x.id)-(+y.id));
  return a;
}
function switchTab(t){ curTab=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); renderList(); }

function dirtyOf(r){
  if((orig.ko[r.id]||"")!==r.ko || (orig.en[r.id]||"")!==r.en) return true;
  const og=orig.gd[r.id]||{}, or=Array.isArray(og.r)?og.r.join(","):(og.r||"");
  return String(og.m??"")!==String(r.m) || or!==r.r || (og.c?og.c.join(","):"")!==r.c.join(",");
}

function renderList(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const L=document.getElementById("list"); L.innerHTML="";
  const frag=document.createDocumentFragment(); let shown=0,dirty=0;
  sortedRows().forEach(r=>{
    const d=dirtyOf(r); if(d) dirty++;
    if(curCat && category(r)!==curCat) return;
    if(q && !(r.ko.toLowerCase().includes(q)||r.en.toLowerCase().includes(q)||r.id.includes(q))) return;
    shown++;
    const el=document.createElement("div");
    el.className="item"+(BB_IDS.has(+r.id)?" bb":"")+(d?" dirty":"");
    const meta = curTab==="names" ? category(r) : (r.m!==""||r.c.length?`max ${esc(r.m)} · ${esc(r.r)} · 비용 ${r.c.length}`:"—");
    el.innerHTML=`<span class="id">${r.id}</span><span class="nm">${esc(displayKo(r)||r.en)||"(이름없음)"}${r.ko&&r.en?`<small>${esc(r.en)}</small>`:""}</span><span class="meta">${meta}</span>`;
    el.onclick=()=>openModal(r.id);
    frag.appendChild(el);
  });
  L.appendChild(frag);
  document.getElementById("status").textContent=`${shown}개 표시 · 변경 ${dirty}개`+(dirty?" (저장 누르면 반영)":"");
}

function openModal(id){
  editId=id; const r=byId[id];
  document.getElementById("mTitle").textContent=(r.ko||r.en||"(이름없음)");
  document.getElementById("mId").textContent="ID "+id+" · "+category(r);
  const body=document.getElementById("mBody");
  if(curTab==="names"){
    const bb=BB_IDS.has(+id);
    body.innerHTML=
      `<div class="fld"><label>영문 (en)</label><input id="f_en" value="${esc(r.en)}"></div>`+
      `<div class="fld"><label>한글 (ko)${bb?' — 장인기지: 저장 시 _BB 자동':''}</label><input id="f_ko" value="${esc(displayKo(r))}"></div>`;
  }else{
    const cg=r.c.map((v,i)=>`<div class="c"><b>Lv${i+1}</b><input data-ci="${i}" value="${esc(v)}" inputmode="numeric"></div>`).join("");
    body.innerHTML=
      `<div class="fld" style="display:flex;gap:8px">`+
        `<div style="width:96px"><label>최대레벨</label><input id="f_m" value="${esc(r.m)}" inputmode="numeric"></div>`+
        `<div style="flex:1"><label>자원 (G/E/D, 여러개 쉼표)</label><input id="f_r" value="${esc(r.r)}"></div>`+
      `</div>`+
      `<div class="fld"><label>비용 (레벨별 · 다음 레벨로 올릴 비용)</label><div class="costgrid" id="f_cg">${cg||'<span class="muted">데이터 없음</span>'}</div>`+
      `<p class="muted" style="margin-top:6px">칸 개수 = 레벨 수. 비우면 0으로 저장됩니다.</p></div>`;
  }
  document.getElementById("modalOv").style.display="flex";
}
function closeModal(){ document.getElementById("modalOv").style.display="none"; editId=null; }
function saveModal(){
  const r=byId[editId];
  if(curTab==="names"){
    r.en=document.getElementById("f_en").value.trim();
    let ko=document.getElementById("f_ko").value.trim();
    if(BB_IDS.has(+editId) && ko && !ko.endsWith("_BB")) ko+="_BB";
    r.ko=ko;
  }else{
    r.m=document.getElementById("f_m").value.trim();
    r.r=document.getElementById("f_r").value.trim();
    r.c=[...document.querySelectorAll("#f_cg input")].map(i=>Number(String(i.value).trim())||0);
  }
  closeModal(); renderList();
}

async function saveAll(){
  const ko={},en={},gd={};
  for(const r of rows){
    if(r.en) en[r.id]=r.en;
    if(r.ko) ko[r.id]=r.ko;
    const m=r.m===""?null:Number(r.m);
    const rr=r.r.includes(",")?r.r.split(",").map(x=>x.trim()).filter(Boolean):(r.r||null);
    const c=r.c.length?r.c.slice():null;
    if(m!=null||rr||c){ const o={}; if(m!=null)o.m=m; if(rr)o.r=rr; if(c)o.c=c; gd[r.id]=o; }
  }
  const next={en,ko,gd}, b=document.getElementById("saveBtn"), st=document.getElementById("status");
  b.disabled=true;
  try{
    let n=0;
    for(const k of ["en","ko","gd"]){
      if(JSON.stringify(next[k])===JSON.stringify(orig[k])) continue;
      st.textContent="저장 중: "+FILES[k]+"…";
      await putFile(k, JSON.stringify(next[k]));
      orig[k]=JSON.parse(JSON.stringify(next[k])); n++;
    }
    buildRows(); renderList();
    st.textContent = n?`✓ 저장됨 (${n}개 파일) — 1~2분 뒤 앱에 반영`:"변경 없음";
  }catch(e){ st.textContent="저장 실패: "+e.message; }
  finally{ b.disabled=false; }
}
async function putFile(k,content){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILES[k]}`,{method:"PUT",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:`DB 편집: ${FILES[k]}`,content:b64encode(content),sha:shas[k],branch:BRANCH})});
  if(!r.ok){ const t=await r.text(); throw new Error(FILES[k]+" "+r.status+" "+t.slice(0,90)); }
  const j=await r.json(); shas[k]=j.content.sha;
}
function logout(){ localStorage.removeItem("gh_token"); location.reload(); }
(function(){ const t=localStorage.getItem("gh_token"); if(t) document.getElementById("tok").value=t; })();
</script>
</body>
</html>
