<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCTimer DB 편집</title>
<style>
  :root{--bg:#0f1a12;--card:#182619;--line:rgba(255,255,255,.1);--gold:#F5B82E;--txt:#F2EFE4;--sub:#8FA08C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Noto Sans KR","Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:0 0 4px}.muted{color:var(--sub);font-size:12px;line-height:1.5}
  input,select,button{font-family:inherit}
  .gate{max-width:460px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .gate input[type=password]{width:100%;padding:10px;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .btn{background:var(--gold);color:#1f1709;border:none;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--line)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
  .toolbar input.search{flex:1;min-width:130px;padding:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
  th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
  th{color:var(--sub);font-size:11px;position:sticky;top:54px;background:var(--bg)}
  td input{width:100%;background:var(--bg);border:1px solid transparent;border-radius:6px;color:var(--txt);padding:5px}
  td input:focus{border-color:var(--gold);outline:none}
  td.id{color:var(--sub);font-family:monospace;white-space:nowrap;font-size:11px}
  td.en input{color:var(--sub)}
  .c-in{font-family:monospace;font-size:11px}
  .status{font-size:12px;color:var(--sub)}
  .bb{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>🔒 CCTimer DB 편집</h1>
    <p class="muted">GitHub 토큰(Fine-grained PAT, 이 저장소 <b>Contents: Read and write</b>)을 입력하세요. 토큰은 이 기기에만 저장됩니다.</p>
    <input id="tok" type="password" placeholder="github_pat_... 또는 ghp_..." autocomplete="off">
    <label class="muted"><input type="checkbox" id="remember" checked> 이 기기에 기억</label>
    <div style="margin-top:12px"><button class="btn" id="enterBtn" onclick="enter()">불러오기</button></div>
    <p id="gerr" class="muted" style="color:#E08B8B"></p>
  </div>

  <div id="app" style="display:none">
    <div class="toolbar">
      <input class="search" id="q" placeholder="검색 (이름·ID)" oninput="render()">
      <button class="btn" id="saveBtn" onclick="saveAll()">저장</button>
      <button class="btn ghost" onclick="logout()">잠금</button>
      <span class="status" id="status"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>ID</th><th>영문(en)</th><th>한글(ko)</th><th>max</th><th>자원</th><th>비용 (쉼표구분)</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const OWNER="JaehweePark", REPO="CoC_MultiTimer", BRANCH="main";
const FILES={ en:"names/en.json", ko:"names/ko.json", gd:"gamedata.json" };
let token="", shas={}, orig={en:{},ko:{},gd:{}}, rows=[];

function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,"")))); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

async function enter(){
  token = document.getElementById("tok").value.trim();
  if(!token) return;
  if(document.getElementById("remember").checked) localStorage.setItem("gh_token", token); else localStorage.removeItem("gh_token");
  const btn=document.getElementById("enterBtn"); btn.disabled=true;
  document.getElementById("gerr").textContent="불러오는 중…";
  try{
    for(const [k,path] of Object.entries(FILES)){
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, { headers:{ Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json" } });
      if(!r.ok) throw new Error(path+" "+r.status);
      const j = await r.json();
      shas[k]=j.sha; orig[k]=JSON.parse(b64decode(j.content));
    }
    buildRows();
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    render();
  }catch(e){ document.getElementById("gerr").textContent="실패: "+e.message+" — 토큰/권한(Contents write) 확인"; }
  finally{ btn.disabled=false; }
}

function buildRows(){
  const ids = new Set([...Object.keys(orig.en),...Object.keys(orig.ko),...Object.keys(orig.gd)]);
  rows = [...ids].sort((a,b)=>(+a)-(+b)).map(id=>{
    const g = orig.gd[id]||{};
    return { id, en:orig.en[id]||"", ko:orig.ko[id]||"", m:(g.m??""), r:(g.r||""), c:(g.c?g.c.join(","):"") };
  });
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const tb = document.getElementById("tb"); tb.innerHTML="";
  const frag = document.createDocumentFragment();
  let shown=0;
  rows.forEach((row,i)=>{
    if(q && !(row.ko.toLowerCase().includes(q)||row.en.toLowerCase().includes(q)||row.id.includes(q))) return;
    shown++;
    const tr=document.createElement("tr");
    const bb = row.ko.endsWith("_BB");
    tr.innerHTML =
      `<td class="id ${bb?'bb':''}">${row.id}</td>`+
      `<td class="en"><input value="${esc(row.en)}" data-i="${i}" data-f="en"></td>`+
      `<td><input value="${esc(row.ko)}" data-i="${i}" data-f="ko"></td>`+
      `<td style="width:56px"><input value="${esc(row.m)}" data-i="${i}" data-f="m" inputmode="numeric"></td>`+
      `<td style="width:54px"><input value="${esc(row.r)}" data-i="${i}" data-f="r"></td>`+
      `<td><input class="c-in" value="${esc(row.c)}" data-i="${i}" data-f="c"></td>`;
    frag.appendChild(tr);
  });
  tb.appendChild(frag);
  tb.oninput = (e)=>{ const t=e.target; if(t.dataset.i!=null) rows[t.dataset.i][t.dataset.f]=t.value; };
  document.getElementById("status").textContent = `${shown} / ${rows.length}개`;
}

async function saveAll(){
  const ko={},en={},gd={};
  for(const row of rows){
    if(row.en) en[row.id]=row.en;
    if(row.ko) ko[row.id]=row.ko;
    const m = row.m===""?null:Number(row.m);
    const c = String(row.c).trim()?String(row.c).split(",").map(x=>Number(x.trim())).filter(x=>!isNaN(x)):null;
    if(m!=null || row.r || c){ const o={}; if(m!=null)o.m=m; if(row.r)o.r=row.r; if(c)o.c=c; gd[row.id]=o; }
  }
  const next={en,ko,gd};
  const btn=document.getElementById("saveBtn"); btn.disabled=true;
  const st=document.getElementById("status");
  try{
    let changed=0;
    for(const k of ["en","ko","gd"]){
      if(JSON.stringify(next[k])===JSON.stringify(orig[k])) continue;
      st.textContent=`저장 중: ${FILES[k]}…`;
      await putFile(k, JSON.stringify(next[k]));
      orig[k]=JSON.parse(JSON.stringify(next[k])); changed++;
    }
    st.textContent = changed ? `✓ 저장됨 (${changed}개 파일) — 1~2분 뒤 앱에 반영` : "변경 없음";
  }catch(e){ st.textContent="저장 실패: "+e.message; }
  finally{ btn.disabled=false; }
}
async function putFile(k,content){
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILES[k]}`, {
    method:"PUT",
    headers:{ Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify({ message:`DB 편집: ${FILES[k]}`, content:b64encode(content), sha:shas[k], branch:BRANCH })
  });
  if(!r.ok){ const t=await r.text(); throw new Error(FILES[k]+" "+r.status+" "+t.slice(0,100)); }
  const j=await r.json(); shas[k]=j.content.sha;
}
function logout(){ localStorage.removeItem("gh_token"); location.reload(); }

(function(){ const t=localStorage.getItem("gh_token"); if(t) document.getElementById("tok").value=t; })();
</script>
</body>
</html>
