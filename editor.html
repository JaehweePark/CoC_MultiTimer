<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCTimer DB 편집</title>
<style>
  :root{--bg:#0f1a12;--card:#182619;--line:rgba(255,255,255,.1);--gold:#F5B82E;--txt:#F2EFE4;--sub:#8FA08C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Noto Sans KR","Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:0 0 4px}.muted{color:var(--sub);font-size:12px;line-height:1.5}
  input,select,button{font-family:inherit}
  .gate{max-width:460px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .gate input[type=password]{width:100%;padding:10px;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .btn{background:var(--gold);color:#1f1709;border:none;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--line)}
  .topbar{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tab{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--sub);border-radius:99px;padding:7px 16px;font-weight:800;cursor:pointer}
  .tab.on{background:var(--gold);color:#1f1709;border-color:var(--gold)}
  .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row2 input.search{flex:1;min-width:130px;padding:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .row2 select{padding:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
  .row2 select.lang{border-color:var(--gold);color:var(--gold);font-weight:700}
  .cats{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .cat{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--sub);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .cat.on{background:#F2EFE4;color:#14210f;border-color:#F2EFE4}
  .status{font-size:12px;color:var(--sub);margin-top:6px}
  .list{margin-top:6px}
  .item{display:flex;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:active{background:rgba(255,255,255,.05)}
  .item .id{font-family:monospace;font-size:11px;color:var(--sub);width:64px;flex:none}
  .item .nm{flex:1;font-weight:700}.item .nm small{color:var(--sub);font-weight:400;margin-left:6px}
  .item .nm .miss{color:#E08B8B;font-weight:400}
  .item .meta{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
  .item.dirty{background:rgba(245,184,46,.08)}
  .item.bb .nm{color:var(--gold)}
  .item.off{opacity:.5}
  .ptgl{flex:none;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--gold);background:rgba(245,184,46,.15);color:var(--gold)}
  .ptgl.off{border-color:#E08B8B;background:rgba(224,139,139,.12);color:#E08B8B}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:16px}.modal .mid{font-family:monospace;font-size:11px;color:var(--sub);margin-bottom:12px}
  .fld{margin-bottom:10px}.fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
  .fld input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt)}
  .fld.base input{border-color:rgba(255,255,255,.2);color:var(--sub)}
  .costgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .costgrid .c{display:flex;align-items:center;gap:3px}.costgrid .c b{font-size:10px;color:var(--sub);width:28px;flex:none}
  .costgrid .c input{width:100%;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px}
  .mbtns{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>🔒 CCTimer DB 편집</h1>
    <p class="muted">GitHub Fine-grained 토큰(이 저장소 <b>Contents: Read and write</b>). 토큰은 이 기기에만 저장됩니다.</p>
    <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
    <label class="muted"><input type="checkbox" id="remember" checked> 이 기기에 기억</label>
    <div style="margin-top:12px"><button class="btn" id="enterBtn" onclick="enter()">불러오기</button></div>
    <p id="gerr" class="muted" style="color:#E08B8B"></p>
  </div>

  <div id="app" style="display:none">
    <div class="topbar">
      <div class="tabs">
        <button class="tab on" data-t="names" onclick="switchTab('names')">이름 수정</button>
        <button class="tab" data-t="gd" onclick="switchTab('gd')">게임데이터 수정</button>
        <button class="tab" data-t="promo" onclick="switchTab('promo')">프로모션</button>
      </div>
      <div class="row2">
        <select id="langsel" class="lang" onchange="setLang(this.value)"></select>
        <input class="search" id="q" placeholder="검색 (이름·ID)" oninput="renderList()">
        <select id="sort" onchange="setSort(this.value)">
          <option value="id">ID순</option>
          <option value="name">이름순</option>
          <option value="cat">분류순</option>
          <option value="max">최대레벨순</option>
          <option value="dirty">변경먼저</option>
          <option value="missing">번역없음먼저</option>
        </select>
        <button class="btn" id="addPromoBtn" style="display:none" onclick="openPromoNew()">+ 코드 추가</button>
        <button class="btn" id="saveBtn" onclick="saveAll()">저장</button>
        <button class="btn ghost" onclick="logout()">잠금</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div id="modalOv" class="ov" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div class="mid" id="mId"></div>
    <div id="mBody"></div>
    <div class="mbtns">
      <button class="btn" onclick="saveModal()">확인</button>
      <button class="btn ghost" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<script>
const OWNER="JaehweePark", REPO="CoC_MultiTimer", BRANCH="main";
// ▼▼ 언어 추가는 여기 LANGS 에 코드만 넣으면 됩니다(파일 없으면 editor가 자동 생성). en=기준 ▼▼
const LANGS=["ko","en"];
const BASE="en";
const LANG_LABEL={ko:"한국어",en:"English",zh:"中文",ja:"日本語",de:"Deutsch",fr:"Français",es:"Español",it:"Italiano",ru:"Русский",pt:"Português",tr:"Türkçe",ar:"العربية",th:"ไทย",vi:"Tiếng Việt",id:"Indonesia",nl:"Nederlands",no:"Norsk",fi:"Suomi"};
const GD_FILE="gamedata.json";
const namesPath=(l)=>"names/"+l+".json";
const PROMO_FILE="promo-codes.json";
const PROMO_SCHEMA={version:1,comment:"CCTimer promo codes. SHA-256 hashed; plaintext never stored.",match:"codeHash = SHA-256 hex of trim+UPPERCASE(code)"};
const UNLOCKS=["all","ad_free","sync","pro"], PLATFORMS=["all","android","ios"];

let token="", shas={}, orig={gd:{}}, rows=[], byId={}, curTab="names", curCat="", curSort="id", editLang="ko", editId=null, promoRows=[], promoEditIdx=-1;

async function sha256Hex(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

const BB_IDS=new Set("1000033 1000034 1000035 1000036 1000037 1000038 1000039 1000040 1000041 1000042 1000043 1000044 1000045 1000046 1000048 1000049 1000050 1000051 1000052 1000053 1000054 1000055 1000056 1000057 1000058 1000063 1000065 1000078 1000080 1000081 1000082 12000010 12000011 12000013 12000014 4000031 4000032 4000033 4000034 4000035 4000036 4000037 4000038 4000041 4000042 4000070 28000003 28000005".split(" ").map(Number));
const TOWERS=new Set("1000008 1000009 1000013 1000012 1000011 1000028 1000019 1000032 1000021 1000027 1000031 1000067 1000077 1000089 1000010 1000084 1000085 1000079 1000086 1000102".split(" ").map(Number));
const RESOURCE=new Set("1000004 1000002 1000005 1000003 1000023 1000024".split(" ").map(Number));
const ARMY=new Set("1000000 1000006 1000026 1000007 1000020 1000029 1000071 1000070 1000059 1000068 1000014".split(" ").map(Number));
const CATS=["방어타워","자원","군대","함정","유닛","마법","영웅","펫","가디언","장인기지","기타건물"];
function category(r){
  if(BB_IDS.has(+r.id)) return "장인기지";
  const id=+r.id;
  if(id>=107000000) return "가디언";
  if(id>=73000000) return "펫";
  if(id>=28000000) return "영웅";
  if(id>=26000000) return "마법";
  if(id>=12000000) return "함정";
  if(id>=4000000) return "유닛";
  if(TOWERS.has(id)) return "방어타워";
  if(RESOURCE.has(id)) return "자원";
  if(ARMY.has(id)) return "군대";
  if(id>=1000000) return "기타건물";
  return "기타";
}
// _BB 는 한국어에서만 자동(장인기지 ID). 다른 언어는 입력값 그대로.
function isBBlang(lang){ return lang==="ko"; }
function disp(r,lang){ const v=r.names[lang]||""; return (isBBlang(lang)&&BB_IDS.has(+r.id))?v.replace(/_BB$/,""):v; }

function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,"")))); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {data:{},sha:null};
  if(!r.ok) throw new Error(path+" "+r.status);
  const j=await r.json(); return {data:JSON.parse(b64decode(j.content)),sha:j.sha};
}

async function enter(){
  token=document.getElementById("tok").value.trim(); if(!token) return;
  if(document.getElementById("remember").checked) localStorage.setItem("gh_token",token); else localStorage.removeItem("gh_token");
  const b=document.getElementById("enterBtn"); b.disabled=true; document.getElementById("gerr").textContent="불러오는 중…";
  try{
    const g=await ghGet(GD_FILE); orig.gd=g.data; shas.gd=g.sha;
    for(const l of LANGS){ const r=await ghGet(namesPath(l)); orig[l]=r.data; shas[l]=r.sha; }
    const pr=await ghGet(PROMO_FILE); orig.promo=(pr.data&&Array.isArray(pr.data.codes))?pr.data:{_schema:PROMO_SCHEMA,codes:[]}; shas.promo=pr.sha;
    promoRows=(orig.promo.codes||[]).map(c=>({...c}));
    buildRows(); renderLangSel(); renderCats();
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    renderList();
  }catch(e){ document.getElementById("gerr").textContent="실패: "+e.message+" — 토큰/권한(Contents write) 확인"; }
  finally{ b.disabled=false; }
}

function buildRows(){
  const ids=new Set(Object.keys(orig.gd));
  LANGS.forEach(l=>Object.keys(orig[l]||{}).forEach(id=>ids.add(id)));
  rows=[...ids].sort((a,b)=>(+a)-(+b)).map(id=>{
    const names={}; LANGS.forEach(l=>names[l]=(orig[l]&&orig[l][id])||"");
    const g=orig.gd[id]||{};
    return { id, names, m:(g.m??""), r:(Array.isArray(g.r)?g.r.join(","):(g.r||"")), c:(g.c?g.c.slice():[]) };
  });
  byId={}; rows.forEach(r=>byId[r.id]=r);
}

function renderLangSel(){
  const s=document.getElementById("langsel");
  s.innerHTML=LANGS.map(l=>`<option value="${l}"${l===editLang?" selected":""}>${LANG_LABEL[l]||l}</option>`).join("");
  s.style.display = curTab==="names" ? "" : "none";
}
function renderCats(){
  const c=document.getElementById("cats");
  const mk=(v,lbl)=>`<button class="cat${curCat===v?' on':''}" onclick="setCat('${v}')">${lbl}</button>`;
  c.innerHTML=mk("","전체")+CATS.map(x=>mk(x,x)).join("");
}
function setCat(c){ curCat=c; renderCats(); renderList(); }
function setSort(v){ curSort=v; renderList(); }
function setLang(v){ editLang=v; renderList(); }
function switchTab(t){
  curTab=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const promo=t==="promo";
  document.getElementById("addPromoBtn").style.display=promo?"":"none";
  document.getElementById("cats").style.display=promo?"none":"";
  document.getElementById("sort").style.display=promo?"none":"";
  document.getElementById("q").placeholder=promo?"검색 (라벨·unlock·해시)":"검색 (이름·ID)";
  renderLangSel(); renderList();
}

function gdDirty(r){
  const og=orig.gd[r.id]||{}, or=Array.isArray(og.r)?og.r.join(","):(og.r||"");
  return String(og.m??"")!==String(r.m) || or!==r.r || (og.c?og.c.join(","):"")!==r.c.join(",");
}
function dirtyOf(r){
  for(const l of LANGS){ if(((orig[l]&&orig[l][r.id])||"")!==r.names[l]) return true; }
  return gdDirty(r);
}

function sortedRows(){
  const a=rows.slice();
  if(curSort==="name") a.sort((x,y)=>String(disp(x,editLang)||x.names[BASE]).localeCompare(String(disp(y,editLang)||y.names[BASE]),"ko"));
  else if(curSort==="cat") a.sort((x,y)=>category(x).localeCompare(category(y),"ko")||(+x.id)-(+y.id));
  else if(curSort==="max") a.sort((x,y)=>(Number(y.m)||0)-(Number(x.m)||0)||(+x.id)-(+y.id));
  else if(curSort==="dirty") a.sort((x,y)=>(dirtyOf(y)?1:0)-(dirtyOf(x)?1:0)||(+x.id)-(+y.id));
  else if(curSort==="missing") a.sort((x,y)=>((x.names[editLang]?0:1)<(y.names[editLang]?0:1)?1:((x.names[editLang]?0:1)>(y.names[editLang]?0:1)?-1:(+x.id)-(+y.id))));
  else a.sort((x,y)=>(+x.id)-(+y.id));
  return a;
}

function renderList(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  if(curTab==="promo") return renderPromoList(q);
  const L=document.getElementById("list"); L.innerHTML="";
  const frag=document.createDocumentFragment(); let shown=0,dirty=0;
  sortedRows().forEach(r=>{
    const d=dirtyOf(r); if(d) dirty++;
    if(curCat && category(r)!==curCat) return;
    if(q && !(r.id.includes(q) || LANGS.some(l=>(r.names[l]||"").toLowerCase().includes(q)))) return;
    shown++;
    const el=document.createElement("div");
    el.className="item"+(BB_IDS.has(+r.id)?" bb":"")+(d?" dirty":"");
    let nm, meta;
    if(curTab==="names"){
      const main=disp(r,editLang);
      nm = main ? esc(main) : '<span class="miss">(번역 없음)</span>';
      const base = editLang!==BASE ? (r.names[BASE]||"") : "";
      if(base) nm += `<small>${esc(base)}</small>`;
      meta = category(r);
    }else{
      nm = esc(disp(r,"ko")||r.names[BASE]||"(이름없음)");
      meta = (r.m!==""||r.c.length)?`max ${esc(r.m)} · ${esc(r.r)} · 비용 ${r.c.length}`:"—";
    }
    el.innerHTML=`<span class="id">${r.id}</span><span class="nm">${nm}</span><span class="meta">${meta}</span>`;
    el.onclick=()=>openModal(r.id);
    frag.appendChild(el);
  });
  L.appendChild(frag);
  document.getElementById("status").textContent=`${shown}개 표시 · 변경 ${dirty}개`+(dirty?" (저장 누르면 반영)":"")+(curTab==="names"?` · 편집언어: ${LANG_LABEL[editLang]||editLang}`:"");
}

// ── 프로모션 코드 탭 ──
function promoDirty(){ const o={_schema:(orig.promo&&orig.promo._schema)||PROMO_SCHEMA,codes:promoRows}; return JSON.stringify(o)!==JSON.stringify(orig.promo||{}); }
function renderPromoList(q){
  const L=document.getElementById("list"); L.innerHTML="";
  const frag=document.createDocumentFragment(); let shown=0;
  promoRows.forEach((c,idx)=>{
    const hay=((c.label||"")+" "+(c.unlock||"")+" "+(c.codeHash||"")).toLowerCase();
    if(q && !hay.includes(q)) return;
    shown++;
    const el=document.createElement("div"); el.className="item"+(c.enabled===false?" off":"");
    const ex=c.expiry||{}; const exTxt = ex.mode==="date" ? ("~"+(ex.date||"?")) : ({0:"무기한",7:"1주일",30:"1개월",180:"6개월",365:"1년"}[ex.days]||((ex.days||0)+"일"));
    const tgl=`<button class="ptgl${c.enabled===false?' off':''}" onclick="togglePromoEnabled(${idx},event)">${c.enabled===false?'꺼짐':'켜짐'}</button>`;
    el.innerHTML=`<span class="id">${esc((c.codeHash||"").slice(0,8))}</span><span class="nm">${esc(c.label||"(라벨 없음)")} <small>${esc(c.unlock||"")}</small></span><span class="meta">${esc(exTxt)} · ${esc(c.platform||"all")}</span>${tgl}`;
    el.onclick=()=>openPromoEdit(idx);
    frag.appendChild(el);
  });
  L.appendChild(frag);
  document.getElementById("status").textContent=`코드 ${promoRows.length}개 · 표시 ${shown}`+(promoDirty()?" · 변경됨(저장 누르면 반영)":"");
}
function togglePromoEnabled(idx, ev){ ev.stopPropagation(); promoRows[idx].enabled = (promoRows[idx].enabled===false); renderList(); }
function openPromoNew(){ promoEditIdx=-1; renderPromoModal({unlock:"all",enabled:true,platform:"all",label:"",expiry:{mode:"duration",days:0}}, true); }
function openPromoEdit(idx){ promoEditIdx=idx; renderPromoModal(promoRows[idx], false); }
function renderPromoModal(c, isNew){
  document.getElementById("mTitle").textContent=isNew?"새 프로모션 코드":"코드 편집";
  document.getElementById("mId").textContent=isNew?"평문 입력 → 저장 시 SHA-256 해시 (평문은 저장 안 됨)":("hash "+(c.codeHash||"").slice(0,16)+"…");
  const sel=(id,opts,val)=>`<select id="${id}" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt)">`+opts.map(o=>`<option value="${o}"${o===val?" selected":""}>${o}</option>`).join("")+`</select>`;
  let html="";
  if(isNew) html+=`<div class="fld"><label>코드 평문 (대소문자 무관 · 저장 후 복구 불가)</label><input id="p_plain" placeholder="예: CCTIMER-PRO2026" autofocus></div>`;
  html+=`<div class="fld"><label>unlock (ad_free=광고제거 · sync=동기화 · pro/all=둘다)</label>${sel("p_unlock",UNLOCKS,c.unlock||"all")}</div>`;
  const ex0=c.expiry||{mode:"duration",days:0};
  const durs=[[7,"1주일"],[30,"1개월"],[180,"6개월"],[365,"1년"],[0,"무기한"]];
  const inp="width:100%;margin-top:6px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt)";
  html+=`<div class="fld"><label>혜택 기간 (코드 입력 후부터)</label>`+
    `<select id="p_exmode" onchange="pExMode(this.value)" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt)"><option value="duration"${ex0.mode!=='date'?' selected':''}>기간 선택</option><option value="date"${ex0.mode==='date'?' selected':''}>날짜 지정 (고정 만료일)</option></select>`+
    `<select id="p_exdur" style="${inp};${ex0.mode==='date'?'display:none':''}">${durs.map(([v,l])=>`<option value="${v}"${Number(ex0.days||0)===v?' selected':''}>${l}</option>`).join('')}</select>`+
    `<input id="p_exdate" type="date" value="${esc(ex0.date||'')}" style="${inp};${ex0.mode==='date'?'':'display:none'}"></div>`;
  html+=`<div class="fld"><label>platform</label>${sel("p_platform",PLATFORMS,c.platform||"all")}</div>`;
  html+=`<div class="fld"><label>라벨 (운영용 메모)</label><input id="p_label" value="${esc(c.label||"")}"></div>`;
  html+=`<div class="fld"><label><input type="checkbox" id="p_enabled"${c.enabled!==false?" checked":""}> 활성(enabled)</label></div>`;
  if(!isNew) html+=`<div style="margin-top:4px"><button class="btn ghost" style="color:#E08B8B;border-color:#E08B8B" onclick="deletePromo()">이 코드 삭제</button></div>`;
  document.getElementById("mBody").innerHTML=html;
  document.getElementById("modalOv").style.display="flex";
}
function pExMode(v){ document.getElementById("p_exdur").style.display=v==="duration"?"":"none"; document.getElementById("p_exdate").style.display=v==="date"?"":"none"; }
async function savePromoModal(){
  const g=(id)=>document.getElementById(id);
  const exmode=g("p_exmode").value;
  const expiry = exmode==="date" ? {mode:"date", date:g("p_exdate").value||null} : {mode:"duration", days:Number(g("p_exdur").value)||0};
  const entry={ unlock:g("p_unlock").value, expiry, enabled:g("p_enabled").checked, platform:g("p_platform").value, label:g("p_label").value.trim(), maxUses:null };
  if(promoEditIdx<0){
    const plain=g("p_plain").value.trim().toUpperCase();
    if(!plain){ alert("평문 코드를 입력하세요"); return; }
    entry.codeHash=await sha256Hex(plain);
    if(promoRows.some(c=>c.codeHash===entry.codeHash)){ alert("이미 등록된 코드입니다"); return; }
    entry.createdAt=new Date().toISOString();
    promoRows.push(entry);
  }else{
    const cur=promoRows[promoEditIdx];
    entry.codeHash=cur.codeHash; entry.createdAt=cur.createdAt||new Date().toISOString();
    promoRows[promoEditIdx]=entry;
  }
  closeModal(); renderList();
}
function deletePromo(){ if(promoEditIdx>=0 && confirm("이 코드를 삭제할까요?")){ promoRows.splice(promoEditIdx,1); closeModal(); renderList(); } }

function openModal(id){
  editId=id; const r=byId[id];
  document.getElementById("mTitle").textContent=(disp(r,editLang)||r.names[BASE]||"(이름없음)");
  document.getElementById("mId").textContent="ID "+id+" · "+category(r);
  const body=document.getElementById("mBody");
  if(curTab==="names"){
    let html="";
    if(editLang!==BASE) html+=`<div class="fld base"><label>${LANG_LABEL[BASE]||BASE} (기준)</label><input id="f_base" value="${esc(r.names[BASE]||"")}"></div>`;
    const bbNote = (isBBlang(editLang)&&BB_IDS.has(+id)) ? " — 장인기지: 저장 시 _BB 자동" : "";
    html+=`<div class="fld"><label>${LANG_LABEL[editLang]||editLang}${bbNote}</label><input id="f_lang" value="${esc(disp(r,editLang))}" autofocus></div>`;
    body.innerHTML=html;
  }else{
    const cg=r.c.map((v,i)=>`<div class="c"><b>Lv${i+1}</b><input data-ci="${i}" value="${esc(v)}" inputmode="numeric"></div>`).join("");
    body.innerHTML=
      `<div class="fld" style="display:flex;gap:8px">`+
        `<div style="width:96px"><label>최대레벨</label><input id="f_m" value="${esc(r.m)}" inputmode="numeric"></div>`+
        `<div style="flex:1"><label>자원 (G/E/D, 여러개 쉼표)</label><input id="f_r" value="${esc(r.r)}"></div>`+
      `</div>`+
      `<div class="fld"><label>비용 (레벨별 · 다음 레벨로 올릴 비용)</label><div class="costgrid" id="f_cg">${cg||'<span class="muted">데이터 없음</span>'}</div>`+
      `<p class="muted" style="margin-top:6px">칸 개수 = 레벨 수. 비우면 0으로 저장됩니다.</p></div>`;
  }
  document.getElementById("modalOv").style.display="flex";
}
function closeModal(){ document.getElementById("modalOv").style.display="none"; editId=null; }
async function saveModal(){
  if(curTab==="promo") return savePromoModal();
  const r=byId[editId];
  if(curTab==="names"){
    if(editLang!==BASE){ const fb=document.getElementById("f_base"); if(fb) r.names[BASE]=fb.value.trim(); }
    let v=document.getElementById("f_lang").value.trim();
    if(isBBlang(editLang) && BB_IDS.has(+editId) && v && !v.endsWith("_BB")) v+="_BB";
    r.names[editLang]=v;
  }else{
    r.m=document.getElementById("f_m").value.trim();
    r.r=document.getElementById("f_r").value.trim();
    r.c=[...document.querySelectorAll("#f_cg input")].map(i=>Number(String(i.value).trim())||0);
  }
  closeModal(); renderList();
}

async function saveAll(){
  const b=document.getElementById("saveBtn"), st=document.getElementById("status");
  b.disabled=true;
  try{
    let n=0;
    // 언어별 이름 파일
    for(const l of LANGS){
      const next={}; for(const r of rows){ if(r.names[l]) next[r.id]=r.names[l]; }
      if(JSON.stringify(next)===JSON.stringify(orig[l]||{})) continue;
      st.textContent="저장 중: "+namesPath(l)+"…";
      await putFile(namesPath(l), JSON.stringify(next), l);
      orig[l]=next; n++;
    }
    // 게임데이터
    const gd={};
    for(const r of rows){
      const m=r.m===""?null:Number(r.m);
      const rr=r.r.includes(",")?r.r.split(",").map(x=>x.trim()).filter(Boolean):(r.r||null);
      const c=r.c.length?r.c.slice():null;
      if(m!=null||rr||c){ const o={}; if(m!=null)o.m=m; if(rr)o.r=rr; if(c)o.c=c; gd[r.id]=o; }
    }
    if(JSON.stringify(gd)!==JSON.stringify(orig.gd)){ st.textContent="저장 중: "+GD_FILE+"…"; await putFile(GD_FILE, JSON.stringify(gd), "gd"); orig.gd=gd; n++; }
    // 프로모션 코드
    const promoObj={_schema:(orig.promo&&orig.promo._schema)||PROMO_SCHEMA, codes:promoRows};
    if(JSON.stringify(promoObj)!==JSON.stringify(orig.promo||{})){ st.textContent="저장 중: "+PROMO_FILE+"…"; await putFile(PROMO_FILE, JSON.stringify(promoObj,null,2), "promo"); orig.promo=promoObj; n++; }
    buildRows(); renderList();
    st.textContent = n?`✓ 저장됨 (${n}개 파일) — 1~2분 뒤 앱에 반영`:"변경 없음";
  }catch(e){ st.textContent="저장 실패: "+e.message; }
  finally{ b.disabled=false; }
}
async function putFile(path, content, shaKey){
  const body={message:`DB 편집: ${path}`, content:b64encode(content), branch:BRANCH};
  if(shas[shaKey]) body.sha=shas[shaKey];   // sha 없으면 새 파일 생성(create)
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:"PUT",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error(path+" "+r.status+" "+t.slice(0,90)); }
  const j=await r.json(); shas[shaKey]=j.content.sha;
}
function logout(){ localStorage.removeItem("gh_token"); location.reload(); }
(function(){ const t=localStorage.getItem("gh_token"); if(t) document.getElementById("tok").value=t; })();
